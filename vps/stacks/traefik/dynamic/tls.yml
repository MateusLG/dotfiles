tls:
  options:
    cf-aop:
      minVersion: VersionTLS12
      sniStrict: true
      clientAuth:
        caFiles:
          - /certs/authenticated_origin_pull_ca.pem
        clientAuthType: RequireAndVerifyClientCert
    ## Nao usada por nenhum router (AOP ligado nas zonas lglabs.tech em 2026-08-23 e
    ## kodium.ai em 2026-09-02). Mantida para dominio novo nascer permissivo ate ligar AOP.
    cf-aop-optional:
      minVersion: VersionTLS12
      clientAuth:
        caFiles:
          - /certs/authenticated_origin_pull_ca.pem
        clientAuthType: VerifyClientCertIfGiven
  certificates:
    - certFile: /certs/lgmateus.crt
      keyFile: /certs/lgmateus.key
    - certFile: /certs/turmasunb.crt
      keyFile: /certs/turmasunb.key
    - certFile: /certs/lglabs.tech.crt
      keyFile: /certs/lglabs.tech.key
    - certFile: /certs/ericsongomes.crt
      keyFile: /certs/ericsongomes.key
    - certFile: /certs/kodium.ai.crt
      keyFile: /certs/kodium.ai.key
