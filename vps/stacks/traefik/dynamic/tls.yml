tls:
  options:
    cf-aop:
      minVersion: VersionTLS12
      sniStrict: true
      clientAuth:
        caFiles:
          - /certs/authenticated_origin_pull_ca.pem
        clientAuthType: RequireAndVerifyClientCert
    ## Nao usada por nenhum router: o AOP da zona lglabs.tech foi ligado em 2026-08-23
    ## e o crea passou a exigir o cert de cliente, igual aos demais. Mantida para o caso
    ## de precisar afrouxar temporariamente algum dominio novo.
    cf-aop-optional:
      minVersion: VersionTLS12
      clientAuth:
        caFiles:
          - /certs/authenticated_origin_pull_ca.pem
        clientAuthType: VerifyClientCertIfGiven
  certificates:
    - certFile: /certs/lgmateus.crt
      keyFile: /certs/lgmateus.key
    - certFile: /certs/turmasunb.crt
      keyFile: /certs/turmasunb.key
    - certFile: /certs/lglabs.tech.crt
      keyFile: /certs/lglabs.tech.key
    - certFile: /certs/ericsongomes.crt
      keyFile: /certs/ericsongomes.key
