services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    ## read_only:true quebra o start: a imagem gera /usr/local/etc/haproxy/haproxy.cfg
    ## a partir de um template no mesmo diretorio, via sed, a cada boot (ver entrypoint
    ## da imagem). Sem escrita ali o container fica em crash loop.
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    depends_on:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      ## Portas alternativas ate o corte (Task 6), onde viram 80 e 443.
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - /etc/ssl/cloudflare:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge
      - socket

networks:
  edge:
    external: true
  socket:
    internal: true
