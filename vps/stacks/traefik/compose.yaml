services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    ## read_only:true exige tmpfs em /run e /var/lib/haproxy (escritas de boot, sem
    ## conteudo relevante na imagem) e um volume nomeado em /usr/local/etc/haproxy:
    ## o Docker semeia volume nomeado com o conteudo da imagem no primeiro mount, entao
    ## o haproxy.cfg.template sobrevive e o entrypoint gera o .cfg ao lado via sed.
    ## Um tmpfs nesse caminho apagaria o template e quebraria o boot (foi o que
    ## aconteceu na primeira tentativa, sem tmpfs nem volume nomeado).
    read_only: true
    tmpfs:
      - /run
      - /var/lib/haproxy
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - socket-config:/usr/local/etc/haproxy
    networks:
      - socket

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    depends_on:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      ## Portas alternativas ate o corte (Task 6), onde viram 80 e 443.
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - /etc/ssl/cloudflare:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge
      - socket

networks:
  edge:
    external: true
  socket:
    internal: true

volumes:
  socket-config:
