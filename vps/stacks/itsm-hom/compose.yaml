## Homologacao ITSM: PRs #197-#207, commit fc4ec5a919f759e92b2e1692c313053469030e2a.
## Imagem Linux construida com dependencias reais e revisao imutavel.
## Banco/anexos contêm o mundo sintetico de homologacao; HOMOL permite picker.
## Migracoes sao aplicadas em procedimento controlado com backup/restauracao,
## nunca db push --accept-data-loss na inicializacao.
services:
  itsm-hom:
    image: itsm-hom:rdm-fc4ec5a
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    group_add:
      - "114" # Grupo clamav do host, socket Unix 0660.
    tmpfs:
      - /tmp
      - /app/.next/cache
    environment:
      TZ: America/Sao_Paulo
      HOMOL: "true"
      NEXTAUTH_URL: https://itsm.lglabs.tech
      APP_URL: https://itsm.lglabs.tech
      AUTH_URL: https://itsm.lglabs.tech
      NEXTAUTH_SECRET: ${ITSM_HOM_NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: ${ITSM_HOM_DATABASE_URL}
      ANEXOS_DIR: /dados/anexos
      RDM_FLUXO_HABILITADO: "true"
      RDM_UPLOAD_HABILITADO: "true"
      RDM_CLAMD_SOCKET: /run/clamav/clamd.ctl
      RDM_ENTREGAS_CHAVE: ${ITSM_HOM_RDM_ENTREGAS_CHAVE}
      RDM_JOBS_SECRET: ${ITSM_HOM_RDM_JOBS_SECRET}
      SMTP_HOST: rdm-mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      EMAIL_FROM: "ITSM Homologação <itsm@example.invalid>"
      LOG_LEVEL: info
    depends_on:
      rdm-mailpit:
        condition: service_healthy
    command: ["node", "server.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge
      - rdm-email
    volumes:
      - anexos:/dados
      - /run/clamav:/run/clamav:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.itsm-hom.rule=Host(`itsm.lglabs.tech`) || Host(`itsm-hom.lglabs.tech`)
      - traefik.http.routers.itsm-hom.entrypoints=websecure
      - traefik.http.routers.itsm-hom.tls.options=cf-aop@file
      - traefik.http.services.itsm-hom.loadbalancer.server.port=5000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/login',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  rdm-mailpit:
    # Captura privada de homologação: sem relay, portas publicadas ou Traefik.
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      TZ: America/Sao_Paulo
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
      MP_MAX_AGE: "7d"
      MP_MAX_MESSAGE_SIZE: "1"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
    networks:
      - rdm-email
    volumes:
      - rdm-email:/data
    labels:
      - traefik.enable=false
volumes:
  rdm-email:
  anexos:
    external: true
    name: itsm-hom_anexos
networks:
  rdm-email:
    internal: true
  edge:
    external: true
