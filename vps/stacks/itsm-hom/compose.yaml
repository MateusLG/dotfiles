## ITSM homologação: mesma revisão de gtd-embratur/itsm main.
## Commit: e03b0617145af60b0382eee60bb5d037184994aa.
services:
  itsm-hom:
    image: itsm-hom:main-e03b061
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    environment:
      TZ: America/Sao_Paulo
      HOMOL: "true"
      ALLOWED_GOOGLE_HD: "example.invalid" # Somente pré-cadastros sintéticos; OAuth em HOMOL continua bloqueado.
      NEXTAUTH_URL: https://itsm.lglabs.tech
      APP_URL: https://itsm.lglabs.tech
      AUTH_URL: https://itsm.lglabs.tech
      NEXTAUTH_SECRET: ${ITSM_HOM_NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: ${ITSM_HOM_DATABASE_URL}
      ANEXOS_DIR: /dados/anexos
      LOG_LEVEL: info
    command: ["node", "server.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge
    volumes:
      - anexos:/dados
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.itsm-hom.rule=Host(`itsm.lglabs.tech`) || Host(`itsm-hom.lglabs.tech`)
      - traefik.http.routers.itsm-hom.entrypoints=websecure
      - traefik.http.routers.itsm-hom.tls.options=cf-aop@file
      - traefik.http.services.itsm-hom.loadbalancer.server.port=5000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/login',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  anexos:
    external: true
    name: itsm-hom_anexos
networks:
  edge:
    external: true
